<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../admin_header/admin_header.css" />
    <link rel="stylesheet" href="./admin_records.css" />
  </head>
  <body>
    <div id="header"></div>

    <div class="records-top">
      <h1>기록 관리</h1>
      <button id="add-record-btn" class="btn-add">+ 새 기록 추가</button>
    </div>

    <div class="records-container" id="records-container"></div>

    <!-- 추가/수정 모달 -->
    <div id="record-modal" class="modal hidden">
      <div class="modal-box">
        <h2 id="modal-title">기록 추가</h2>
        <form id="record-form">
          <input type="hidden" id="record-id" />

          <div class="form-group">
            <label>기록 제목</label>
            <input
              type="text"
              id="record-name"
              placeholder="제목을 입력하세요"
              required
            />
          </div>

          <div class="form-group">
            <label>기록 보유자</label>
            <input
              type="text"
              id="holder-name"
              placeholder="이름을 입력하세요"
              required
            />
          </div>

          <div class="form-group">
            <label>기록 값</label>
            <input
              type="text"
              id="record-value"
              placeholder="기록을 입력하세요"
              required
            />
          </div>

          <div class="form-group">
            <label>설명</label>
            <input
              type="text"
              id="description"
              placeholder="간단한 설명을 입력하세요"
            />
          </div>

          <div class="form-group">
            <label>사진 URL</label>
            <input type="text" id="photo-url" placeholder="선택사항" />
          </div>

          <div class="form-group">
            <label>유튜브 URL</label>
            <input
              type="text"
              id="youtube-url"
              placeholder="https://youtube.com/watch?v=..."
            />
          </div>

          <div class="form-group">
            <label>기록 날짜</label>
            <input type="date" id="recorded-at" required />
          </div>

          <div class="modal-actions">
            <button type="button" id="modal-cancel" class="btn-cancel">
              취소
            </button>
            <button type="submit" class="btn-save">저장</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../admin_header/admin_header.js"></script>
    <script src="./admin_records.js" defer></script>
    <script>
      async function fetchRecords() {
        const res = await fetch("http://localhost:3000/api/records");
        return await res.json();
      }

      async function saveRecord(record) {
        const token = localStorage.getItem("access_token");
        const method = record.id ? "PUT" : "POST";
        const url = record.id
          ? `http://localhost:3000/api/records/${record.id}`
          : "http://localhost:3000/api/records";

        const res = await fetch(url, {
          method,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify(record),
        });

        if (!res.ok) {
          const result = await res.json();
          alert(result.message);
          throw new Error(result.message);
        }

        return await res.json();
      }

      async function deleteRecord(id) {
        const token = localStorage.getItem("access_token");
        await fetch(`http://localhost:3000/api/records/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
      }

      // ===== 렌더링 =====

      function createEl(tag, className, text) {
        const el = document.createElement(tag);
        if (className) el.className = className;
        if (text !== undefined) el.textContent = text;
        return el;
      }

      function createRecordCard(record) {
        const card = createEl("div", "record-card");
        card.dataset.id = record.id;

        if (record.photo_url) {
          const img = document.createElement("img");
          img.src = record.photo_url;
          img.alt = record.holder_name;
          img.className = "record-photo";
          card.appendChild(img);
        } else {
          card.appendChild(
            createEl("div", "record-photo record-photo-empty", "사진 없음"),
          );
        }

        const body = createEl("div", "record-body");
        if (record.record_name) {
          body.appendChild(createEl("span", "record-name", record.record_name));
        }
        body.appendChild(createEl("span", "record-holder", record.holder_name));
        body.appendChild(createEl("span", "record-value", record.record_value));
        if (record.description) {
          body.appendChild(createEl("span", "record-desc", record.description));
        }
        body.appendChild(createEl("span", "record-date", record.recorded_at));
        if (record.youtube_url) {
          const link = document.createElement("a");
          link.href = record.youtube_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.className = "record-youtube";
          link.textContent = "▶ 유튜브 보기";
          body.appendChild(link);
        }

        const actions = createEl("div", "record-actions");
        const editBtn = createEl("button", "btn-edit", "수정");
        editBtn.dataset.action = "edit";
        editBtn.addEventListener("click", () => openModal(record));
        const deleteBtn = createEl("button", "btn-delete", "삭제");
        deleteBtn.dataset.action = "delete";
        deleteBtn.addEventListener("click", () => handleDelete(record.id));
        actions.append(editBtn, deleteBtn);

        card.append(body, actions);
        return card;
      }

      async function renderRecords() {
        const container = document.getElementById("records-container");
        container.replaceChildren();

        const data = await fetchRecords();
        const sorted = [...data].sort(
          (a, b) => new Date(b.recorded_at) - new Date(a.recorded_at),
        );

        sorted.forEach((record) => {
          container.appendChild(createRecordCard(record));
        });
      }

      // ===== 모달 제어 =====

      const modal = document.getElementById("record-modal");
      const form = document.getElementById("record-form");

      function openModal(record = null) {
        document.getElementById("modal-title").textContent = record
          ? "기록 수정"
          : "기록 추가";

        document.getElementById("record-id").value = record?.id ?? "";
        document.getElementById("record-name").value =
          record?.record_name ?? "";
        document.getElementById("holder-name").value =
          record?.holder_name ?? "";
        document.getElementById("record-value").value =
          record?.record_value ?? "";
        document.getElementById("description").value =
          record?.description ?? "";
        document.getElementById("photo-url").value = record?.photo_url ?? "";
        document.getElementById("youtube-url").value =
          record?.youtube_url ?? "";
        document.getElementById("recorded-at").value =
          record?.recorded_at ?? "";

        modal.classList.remove("hidden");
      }

      function closeModal() {
        modal.classList.add("hidden");
        form.reset();
      }

      async function handleDelete(id) {
        if (!confirm("이 기록을 삭제하시겠습니까?")) return;
        await deleteRecord(id);
        await renderRecords();
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const record = {
          id: document.getElementById("record-id").value || null,
          record_name: document.getElementById("record-name").value,
          holder_name: document.getElementById("holder-name").value,
          record_value: document.getElementById("record-value").value,
          description: document.getElementById("description").value,
          photo_url: document.getElementById("photo-url").value,
          youtube_url: document.getElementById("youtube-url").value,
          recorded_at: document.getElementById("recorded-at").value,
        };

        await saveRecord(record);
        closeModal();
        await renderRecords();
      });

      document
        .getElementById("add-record-btn")
        .addEventListener("click", () => {
          openModal();
        });

      document
        .getElementById("modal-cancel")
        .addEventListener("click", closeModal);

      document.addEventListener("DOMContentLoaded", () => {
        renderRecords();
      });
    </script>
  </body>
</html>
