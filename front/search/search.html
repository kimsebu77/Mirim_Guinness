<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기록 검색하기</title>
    <link rel="stylesheet" href="../banner/header.css" />
    <link rel="stylesheet" href="search.css" />
    <link rel="stylesheet" href="../footer/footer.css" />
    <link rel="stylesheet" href="../shared/record-detail-modal.css" />
  </head>
  <body>
    <div id="header"></div>
    <div class="se-page">
      <div class="search-text">
        <h1>기록 검색</h1>
        <div class="search-box">
          <input
            id="search-input"
            type="text"
            placeholder="검색어를 입력하세요"
            class="sizeing"
          />
          <button id="search-btn" type="button">
            <img
              src="./search-svgrepo-com.svg"
              width="25"
              height="25"
              alt="검색"
            />
          </button>
        </div>
        <div class="record-list">
          <ul id="record-list"></ul>
        </div>
        <div id="pagination" class="pagination"></div>
      </div>
    </div>
    <div id="footer"></div>

    <script src="../banner/header.js"></script>
    <script src="../footer/footer.js"></script>
    <script src="../shared/record-detail-modal.js"></script>
    <script src="./search.js"></script>
  </body>
</html>
