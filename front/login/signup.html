<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>

    <link rel="stylesheet" href="../banner/header.css" />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div id="header"></div>
    <h1 class="text" alt="text">회원가입</h1>
    <div>
      <form>
        <input type="text" placeholder="아이디" class="login" />
        <input type="password" placeholder="비밀번호" class="login" />
        <input type="email" placeholder="이메일" class="login" />
        <input type="submit" value="회원가입" />
        <a href="./login.html">계정이 이미 있으신가요? 로그인으로 이동</a>
      </form>
    </div>
    <script>
      fetch("../banner/header.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
        });
    </script>
  </body>
</html>
