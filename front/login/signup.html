<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>

    <link rel="stylesheet" href="../banner/header.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="login-container">
      <h1 class="login-text">회원가입</h1>

      <form class="login-form">
        <input type="text" placeholder="이메일" class="login-input" />
        <input type="text" placeholder="아이디" class="login-input" />
        <input type="password" placeholder="비밀번호" class="login-input" />
        <input
          type="password"
          placeholder="비밀번호 확인"
          class="login-input"
        />
        <button type="submit" class="lbutton">회원가입</button>
        <a href="./login.html" class="signup-link">
          계정이 있으신가요? 로그인
        </a>
      </form>
    </main>
    <script>
      fetch("../banner/header.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
        });
    </script>
  </body>
</html>
