<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../banner/header.css" />
    <link rel="stylesheet" href="record.css" />
  </head>
  <body>
    <div id="header"></div>
    <div class="record">
      <h1>기록 신청</h1>
      <div class="con">
        <label>이름</label>
        <input type="text" placeholder="이름을 입력하세요" class="con-input" />
        <label>학생/선생님</label>
        <select>
          <option>학생</option>
          <option>선생님</option>
        </select>
      </div>
      <div class="con">
        <label>이메일</label>
        <input
          type="text"
          placeholder="이메일을 입력하세요"
          class="con-input"
        />
        <select>
          <option value="@gmail.com">@gmail.com</option>
          <option value="@e-mirim.hs.kr">@e-mirim.hs.kr</option>
        </select>
      </div>
      <label>설명</label>
      <input />
      <br /><button class="rbutton">신청하기</button>
    </div>
    <script>
      fetch("../banner/header.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
        });
    </script>
  </body>
</html>
